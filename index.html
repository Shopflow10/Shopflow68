<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer PRO</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.sv{position:fixed;inset:0;display:flex;flex-direction:column}
.sv-prog{display:flex;gap:4px;padding:10px}
.sv-bar{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
.sv-fill{height:100%;width:0%;background:#fff;transition:none}
video{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>

<div class="sv">
  <div class="sv-prog">
    <div class="sv-bar"><div class="sv-fill" id="progress"></div></div>
  </div>
  <video id="video" src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay playsinline></video>
</div>

<script>
const video = document.getElementById("video");
const progress = document.getElementById("progress");

let raf;

function updateProgress(){
  if(!video.duration) {
    raf = requestAnimationFrame(updateProgress);
    return;
  }

  const percent = (video.currentTime / video.duration) * 100;
  progress.style.width = percent + "%";

  if(!video.ended){
    raf = requestAnimationFrame(updateProgress);
  }
}

// iniciar quando pronto
video.addEventListener("loadedmetadata", ()=>{
  cancelAnimationFrame(raf);
  updateProgress();
});

// pausa ao segurar (estilo WhatsApp)
let isHolding = false;

document.addEventListener("touchstart", ()=>{
  isHolding = true;
  video.pause();
});

document.addEventListener("touchend", ()=>{
  if(isHolding){
    video.play();
    updateProgress();
    isHolding = false;
  }
});

</script>

</body>
</html>
